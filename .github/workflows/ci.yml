name: CI

on:
  push:
    branches: [master, next-app]
  pull_request:
    branches: [master, next-app]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dev deps for tests
          pip install pytest>=7.0 httpx>=0.27
          # Install the project itself (editable) so `from metainfer...`
          # resolves in tests without manipulating sys.path.
          pip install -e . --no-deps

      - name: Show environment
        run: |
          python --version
          python -c "import metainfer; print('metainfer ok')"
          pytest --version

      - name: Run unit + integration tests
        env:
          # All agent-touching tests use MockAgentManager — no real
          # subprocess needs to spawn, and no API keys are required.
          METAINFER_DISABLE_NETWORK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # testpaths in pytest.ini picks up every package-local tests/
          # dir (orchestrator, server, each task package under metainfer/tasks/).
          python -m pytest -v --tb=short

      - name: Smoke-import the WebUI app
        run: |
          python -c "
          from metainfer.server.app import create_app
          app = create_app()
          routes = [r.path for r in app.routes]
          assert any('/api/sys-shell/tasks' in r for r in routes), 'missing task routes'
          print('WebUI app boots OK; routes:', len(routes))
          "

  lint:
    # Lightweight syntax/compile check — keeps CI fast and doesn't pin
    # a specific linter that could become a maintenance burden.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile all modules
        run: |
          # py_compile catches syntax errors across the entire package
          # (including per-plugin tests/ subdirs that no test imports).
          python -m compileall -q metainfer/
