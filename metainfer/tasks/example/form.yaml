# YAML schema for the "New Task" creation form in the WebUI.
# Each question is rendered as a form field; answers land in
# requirements.json under the "form" key.
#
# Supported types: text, number, select, textarea, path (directory picker).
# For path fields use `browse: true` to show a directory-picker button.
# Fields marked `required: true` are validated before submission.

schema:
  - name: project_name
    label: "Project name"
    type: text
    required: true
    placeholder: "e.g. my-experiment"

  - name: description
    label: "Description"
    type: textarea
    required: false
    placeholder: "Brief description of this run…"

  - name: max_iterations
    label: "Max iterations"
    type: number
    default: 10
    required: false
