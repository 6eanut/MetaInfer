- key: model_params_path
  question: 模型权重参数文件路径（包含 config.json 与权重文件的目录，或单个 .safetensors/.bin 文件）
  header: Model weights
  required: true
  form: file

- key: target_framework_dir
  question: 移植的目标推理框架源码路径（修改这里的代码以新增模型支持）
  header: Target FW
  required: true
  form: file

- key: reference_sources
  question: 一个或多个不能在目标机器上运行的参考实现源码目录（动态增删，每个可附带备注）
  header: Ref sources
  required: false
  form: textarea
  override_component: kv-list-path-notes

- key: user_notes
  question: 额外的原始诉求 / 业务约束 / 注意事项（自由文本）
  header: User notes
  required: false
  form: textarea

- key: token_budget_max_cost_usd
  question: Token 预算上限（USD；留空则不设限）
  header: Budget
  required: false
  form: number
