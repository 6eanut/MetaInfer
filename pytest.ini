[pytest]
testpaths =
    metainfer/orchestrator/tests
    metainfer/web/tests
    metainfer/tasks/calc_value/tests
    metainfer/tasks/gen_infer_framework/tests
norecursedirs =
    legacy
    .git
    node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
