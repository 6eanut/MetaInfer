[pytest]
# Single testpath = the whole package; pytest recurses into every
# ``tests/`` subdir automatically. Adding a new task package under
# ``metainfer/tasks/<pkg>/tests/`` is picked up with zero edits here.
testpaths = metainfer
norecursedirs =
    legacy
    .git
    node_modules
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
