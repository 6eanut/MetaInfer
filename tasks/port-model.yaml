# Question bank for the `port-model` task type (invoked as `/metainfer port-model`).

- key: target_framework
  question: "Which framework should the model be ported into?"
  header: "Framework"
  required: true
  multi: false
  options:
    - label: "vLLM"
      description: "vLLM (V01 or main branch); paged attention + continuous batching"
    - label: "SGLang"
      description: "SGLang; RadixAttention + structured gen"
    - label: "TensorRT-LLM"
      description: "NVIDIA TRT-LLM builder"
    - label: "Other"
      description: "Specify in notes"

- key: framework_version
  question: "Framework version / commit to base on? (free text)"
  header: "Version"
  required: false
  default: "latest main"

- key: target_model
  question: "Which model to port?"
  header: "Model"
  required: true
  multi: false
  options:
    - label: "Llama 3 / 3.1 / 3.2"
      description: "Standard dense Transformer"
    - label: "Qwen 2.5 / 3"
      description: "Qwen dense or MoE"
    - label: "DeepSeek V2/V3"
      description: "MoE with MLA"
    - label: "Custom architecture"
      description: "Specify in notes"

- key: model_source
  question: "Where do the weights live? (free text — HF repo URL, local path, etc.)"
  header: "Weights"
  required: true

- key: target_hardware
  question: "Target hardware?"
  header: "Hardware"
  required: true
  multi: false
  options:
    - label: "NVIDIA H100"
      description: "SM 90"
    - label: "NVIDIA A100"
      description: "SM 80"
    - label: "NVIDIA RTX 4090"
      description: "Consumer"
    - label: "AMD MI300"
      description: "ROCm"

- key: features
  question: "Which framework features must work for the ported model?"
  header: "Features"
  required: false
  multi: true
  options:
    - label: "Prefill + decode"
      description: "Basic forward correctness"
    - label: "Continuous batching"
      description: "Live batching"
    - label: "Tensor parallelism"
      description: "Multi-GPU TP"
    - label: "Quantization"
      description: "AWQ/GPTQ/fp8"

- key: correctness_ref
  question: "Correctness reference?"
  header: "Reference"
  required: false
  multi: false
  default: "huggingface"
  options:
    - label: "HuggingFace Transformers"
      description: "Compare against HF model.forward"
    - label: "Framework's existing model"
      description: "Compare against the framework's sibling model"

- key: perf_target
  question: "Acceptance perf bar? (free text)"
  header: "Perf bar"
  required: false
  default: "parity with framework's similar-size model"

- key: max_iterations
  question: "Max orchestrator iterations?"
  header: "Max iters"
  required: false
  multi: false
  default: "20"
  options:
    - label: "10"
      description: "Quick prototype"
    - label: "20"
      description: "Balanced (recommended)"
    - label: "50"
      description: "Deep port, multi-day"

- key: extra_notes
  question: "Anything else reviewers should know?"
  header: "Notes"
  required: false
